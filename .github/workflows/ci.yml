name: ci
# the site's checks and actionlint: on every pull request, and called by deploy.yml so a red build never reaches Pages.
# No path filter: main's ruleset requires this check, and a filtered-out run would never report.
on:
  pull_request:
  workflow_call:

permissions:
  contents: read

# a newer push to a pull request cancels its older run; runs on main always finish
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  site:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      # the standard's budget: every script index.html loads before first paint
      - name: Initial JavaScript stays under 125 KB gzipped
        run: |
          total=0
          while read -r script; do
            total=$((total + $(gzip -9 -c "dist$script" | wc -c)))
          done < <(grep -oE '/assets/[^"]+\.js' dist/index.html | sort -u)
          echo "Initial JavaScript: $total bytes gzipped"
          if [ "$total" -gt 125000 ]; then
            echo "::error::Initial JavaScript is $total bytes gzipped, over the 125 KB budget"
            exit 1
          fi
      # the assistant answers from api/knowledge, so it must match the page
      - name: Knowledge matches the page
        run: |
          npm run build:knowledge
          git diff --exit-code api/knowledge || { echo "::error::api/knowledge is out of date: run npm run build:knowledge and commit it"; exit 1; }
      # production packages only: dev advisories don't ship, and Dependabot raises them
      - run: npm audit --omit=dev
      - run: npm run check:licences

  # here, not in api.yml, whose path filters skip a pull request that only changes a workflow
  actions:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ACTIONLINT_VERSION: 1.7.12
      ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: actionlint
        run: |
          set -euo pipefail
          command -v shellcheck
          file=actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz
          curl -fsSL -o "$file" "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/$file"
          echo "$ACTIONLINT_SHA256  $file" | sha256sum -c -
          tar -xzf "$file" actionlint
          ./actionlint -color
